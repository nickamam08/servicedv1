<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Proveedor - SERVICED</title>
    <!-- Configuración para evitar el almacenamiento en caché del navegador -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Librerías Externas: Iconos y Mapas -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Leaflet.js para integración de mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Estilos específicos del panel del proveedor -->
    <link rel="stylesheet" href="provider-dashboard.css?v=1.1.8">
</head>

<body>
    <div class="app-container">
        <!-- Barra Lateral de Navegación del Proveedor -->
        <aside class="app-sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-cube" style="color: var(--primary); margin-right: 8px;"></i>
                    SERVICED
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Enlaces de navegación controlados por provider-dashboard.js -->
                <a href="#" class="nav-item active" data-target="overview">
                    <i class="fas fa-home nav-icon"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-target="services">
                    <i class="fas fa-tools nav-icon"></i>
                    <span>Mis Servicios</span>
                </a>
                <a href="#" class="nav-item" data-target="requests">
                    <i class="fas fa-clipboard-list nav-icon"></i>
                    <span>Solicitudes</span>
                </a>
                <a href="#" class="nav-item" data-target="calendar">
                    <i class="fas fa-calendar-alt nav-icon"></i>
                    <span>Calendario</span>
                </a>
                <a href="#" class="nav-item" data-target="reviews">
                    <i class="fas fa-star nav-icon"></i>
                    <span>Reseñas</span>
                </a>
                <a href="#" class="nav-item" data-target="statistics">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>Estadísticas</span>
                </a>
                <a href="#" class="nav-item" data-target="reports">
                    <i class="fas fa-flag nav-icon"></i>
                    <span>Reportes</span>
                </a>
                <a href="#" class="nav-item" data-target="notifications">
                    <i class="fas fa-bell nav-icon"></i>
                    <span>Notificaciones</span>
                </a>
                <a href="#" class="nav-item" data-target="messages">
                    <i class="fas fa-comment-alt nav-icon"></i>
                    <span>Mensajes</span>
                </a>
                <a href="#" class="nav-item" data-target="profile">
                    <i class="fas fa-user-circle nav-icon"></i>
                    <span>Perfil</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <!-- Botón de cierre de sesión -->
                <a href="#" class="nav-item" id="logout-btn" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt nav-icon"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Área Principal de Contenido -->
        <main class="app-main">
            <!-- Cabecera Dinámica -->
            <header class="app-header">
                <div>
                    <h1 class="text-h2" id="page-title">Vista General</h1>
                    <p class="text-body" id="welcome-msg">Bienvenido a tu panel de control</p>
                </div>
                <!-- Avatar del Proveedor -->
                <div style="display: flex; gap: 16px; align-items: center;">
                    <div class="user-avatar" id="header-avatar">P</div>
                </div>
            </header>

            <!-- Zona de Contenido Dinámico (Donde el JS inyecta las vistas) -->
            <div id="content-area">
                <!-- El contenido se carga dinámicamente según la navegación -->
                <div class="spinner"></div>
            </div>
        </main>
    </div>

    <!-- Modales de Gestión (Ocultos por defecto) -->

    <!-- Modal para Crear/Editar Servicios -->
    <div class="modal-overlay" id="service-modal">
        <div class="modal">
            <h3 class="text-h3" style="margin-bottom: 20px;">Gestión de Servicio</h3>
            <form id="service-form">
                <input type="hidden" id="service-id">
                <div class="form-group">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" id="service-title" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" id="service-description" required rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Precio</label>
                    <input type="number" class="form-control" id="service-price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Categoría</label>
                    <input type="text" class="form-control" id="service-category">
                </div>
                <!-- Área de subida de imágenes para el servicio -->
                <div class="form-group">
                    <label class="form-label">Imagen del Servicio</label>
                    <div id="service-drop-zone" class="drop-zone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Arrastra una imagen aquí o haz clic para subir</p>
                        <input type="file" id="service-image-input" accept="image/*" style="display: none;">
                    </div>
                    <div id="service-image-preview" style="margin-top: 12px; display: none; text-align: center;">
                        <img src="" alt="Preview"
                            style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #E5E7EB;">
                    </div>
                </div>
                <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="button" class="btn btn-secondary" onclick="closeServiceModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Reprogramar Solicitudes/Citas -->
    <div class="modal-overlay" id="reschedule-modal">
        <div class="modal">
            <h3 class="text-h3" style="margin-bottom: 20px;">Reprogramar Cita</h3>
            <form id="reschedule-form">
                <input type="hidden" id="reschedule-request-id">
                <div class="form-group">
                    <label class="form-label">Nueva Fecha y Hora</label>
                    <input type="datetime-local" class="form-control" id="reschedule-date" required>
                </div>
                <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="button" class="btn btn-secondary" onclick="closeRescheduleModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Confirmar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Contenedor para Notificaciones Flash (Toasts) -->
    <div id="toast-container" style="position: fixed; bottom: 24px; right: 24px; z-index: 2000;"></div>

    <!-- Lógica principal del Dashboard -->
    <script src="provider-dashboard.js?v=1.1.9"></script>
</body>

</html>
