    <style>
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Override client-card to fit inside bento or stand alone */
        .client-card-item {
            background: var(--bg-surface-alt);

        .client-card-item:hover {

            border-color: var(--primary);
        }

        .client-avatar {

            border-radius: 50%;
            background: #DBEAFE;
            color: #1E40AF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;

        }

        .client-info h3 {

            font-size: 1.1rem;
            color: var(--text-main);
        }

        .client-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stat-badge {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 0.75rem;
            margin-top: 6px;
            display: inline-block;
            font-weight: 500;
        }
    </style>

    <script>
        /**
         * Gestión de la vista de Clientes del Proveedor.
         * Se encarga de cargar y mostrar la lista de usuarios que han contratado servicios.
         */
        document.addEventListener("DOMContentLoaded", async () => {
            const API_BASE_URL = "/api/v1";
            const token = sessionStorage.getItem("serviced_token");
            const userStr = sessionStorage.getItem("serviced_user");

            // Validación de sesión activa: Redirige al login si no hay token
            if (!token || !userStr) {
                window.location.href = "../serviced-users/login.html";
                return;
            }

            const user = JSON.parse(userStr);

            /**
             * Obtiene la lista de clientes única del proveedor desde el backend.
             */
            try {
                const response = await fetch(`${API_BASE_URL}/provider/dashboard/clients`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Error al obtener clientes");

                const clients = await response.json();
                renderClients(clients);

                // Lógica de búsqueda en tiempo real (filtrado por nombre)
                const searchInput = document.getElementById("clientSearch");
                if (searchInput) {
                    searchInput.addEventListener("input", (e) => {
                        const term = e.target.value.toLowerCase();
                        const filtered = clients.filter(c =>
                            c.full_name.toLowerCase().includes(term) ||
                            (c.email && c.email.toLowerCase().includes(term))
                        );
                        renderClients(filtered);
                    });
                }

            } catch (error) {
                console.error("Error al cargar clientes:", error);
                document.getElementById("clientsContainer").innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: red; padding: 40px;">
                        <p>Error al cargar la lista de clientes. Por favor, intenta de nuevo más tarde.</p>
                    </div>`;
            }

            // Manejo del cierre de sesión
            const logoutLink = document.querySelector(".logout-link");
            if (logoutLink) {
                logoutLink.addEventListener("click", (e) => {
                    e.preventDefault();
                    sessionStorage.removeItem("serviced_token");
                    sessionStorage.removeItem("serviced_user");
                    window.location.href = "../serviced-users/login.html";
                });
            }
        });

        /**
         * Renderiza las tarjetas de los clientes en el grid.
         * @param {Array} clients - Lista de objetos cliente.
         */
        function renderClients(clients) {
            const container = document.getElementById("clientsContainer");
            if (!container) return;

            // Mostrar mensaje si no hay resultados para el filtro o la carga inicial
            if (!Array.isArray(clients) || clients.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">
                        <p>No se encontraron clientes activos o bajo este término de búsqueda.</p>
                    </div>`;
                return;
            }

            // Mapeo de clientes a HTML con avatar dinámico y estadísticas
            container.innerHTML = clients.map(client => `
                <div class="client-card-item">
                    <div class="client-avatar">
                        ${client.avatar_url ?
                    `<img src="${client.avatar_url}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` :
                    (client.avatar_initials || client.full_name.substring(0, 2).toUpperCase())}
                    </div>
                    <div class="client-info">
                        <h3 style="font-weight: 700;">${client.full_name}</h3>
                        <p style="font-size: 0.85rem; margin-bottom: 4px;">📧 ${client.email}</p>
                        ${client.phone ? `<p style="font-size: 0.85rem; margin-bottom: 4px;">📞 ${client.phone}</p>` : ''}
                        ${client.location ? `<p style="font-size: 0.85rem;">📍 ${client.location}</p>` : ''}
                        <span class="stat-badge" style="margin-top: 10px;">${client.requests_count} Servicios contratados</span>
                    </div>
                </div>
            `).join("");
        }
    </script>
    <script>
        // Avatar Sync (Header)
        (function () {
            try {
                const user = JSON.parse(sessionStorage.getItem("serviced_user"));
                if (user) {
                    // Update header avatar
                    const headerAvatar = document.querySelector(".app-header .user-avatar");
                    if (headerAvatar) {
                        if (user.avatar_url) {
                            headerAvatar.innerHTML = `<img src="${user.avatar_url}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                        } else {
                            headerAvatar.textContent = (user.full_name || "P").split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
                        }
                    }
                    // Update header name
                    const nameEl = document.querySelector(".user-name");
                    if (nameEl) nameEl.textContent = `Bienvenido, ${user.full_name}`;
                }
            } catch (e) { }
        })();
    </script>
