<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - SERVICED</title>
    <!-- Global Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Chat Specific Styles -->
    <link rel="stylesheet" href="user-chat.css">
</head>

<body>

    <div class="app-container">

        <!-- Sidebar (User Dashboard) -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo">
                    <img src="log.png" alt="SERVICED" style="height: 40px; width: auto;">
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="client-dashboard.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="search-services.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <span>Buscar Servicios</span>
                </a>
                <a href="user-requests.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Mis Solicitudes</span>
                </a>
                <a href="notifications.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Notificaciones</span>
                </a>
                <a href="user-chat.html" class="nav-item active">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Mensajes</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span>Reportes</span>
                </a>
                <a href="user-profile.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Perfil</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="logout-link">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Main Content (Chat Mode) -->
        <main class="app-main chat-mode">

            <!-- Chat App Container -->
            <div class="chat-container" id="chat-container">

                <!-- Chat Sidebar (Conversation List) -->
                <aside class="chat-sidebar">
                    <div class="chat-search-container">
                        <input type="text" class="chat-search-input" placeholder="Buscar conversación..."
                            id="search-input">
                    </div>

                    <div class="conversation-list" id="conversation-list">
                        <!-- Example Loading State -->
                        <div style="padding: 20px; text-align: center; color: var(--text-tertiary);">
                            <span style="display: inline-block; animation: spin 1s linear infinite;">⏳</span>
                            Cargando...
                        </div>
                    </div>
                </aside>

                <!-- Chat Area -->
                <section class="chat-area">

                    <!-- Chat Header -->
                    <div class="chat-header" id="chat-header" style="visibility: hidden;">
                        <div class="header-user">
                            <div class="back-button" id="back-button">←</div>
                            <div class="avatar" id="header-avatar">?</div>
                            <div class="header-info">
                                <h3 id="header-name">Selecciona un chat</h3>
                                <div class="header-status" id="header-status"></div>
                            </div>
                        </div>
                        <div class="header-actions">
                            <!-- Optional actions -->
                        </div>
                    </div>

                    <!-- Empty State (Default) -->
                    <div class="chat-empty-state" id="empty-state">
                        <div class="empty-icon">💬</div>
                        <h3>Tus Mensajes</h3>
                        <p>Selecciona una conversación para hablar con tus proveedores.</p>
                    </div>

                    <!-- Messages (Hidden by default) -->
                    <div class="messages-container" id="messages-container" style="display: none;">
                        <!-- Messages inserted here via JS -->
                    </div>

                    <!-- Input Area (Hidden by default) -->
                    <div class="chat-input-area" id="input-area" style="display: none;">
                        <div class="input-wrapper">
                            <button class="btn-icon" title="Adjuntar archivo (Demo)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                                    </path>
                                </svg>
                            </button>
                            <textarea class="chat-input" placeholder="Escribe un mensaje..." rows="1"
                                id="message-input"></textarea>
                            <button class="btn-send" id="send-btn" disabled>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                    viewBox="0 0 16 16">
                                    <path
                                        d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                </section>

            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="user-chat.js"></script>
</body>

</html>
