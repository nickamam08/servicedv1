<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Servicios - SERVICED</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container">

        <!-- Navigation Sidebar -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo">
                    <img src="log.png" alt="SERVICED" style="height: 40px; width: auto;">
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="client-dashboard.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="search-services.html" class="nav-item active">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <span>Buscar Servicios</span>
                </a>
                <a href="user-requests.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Mis Solicitudes</span>
                </a>
                <a href="notifications.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Notificaciones</span>
                </a>
                <a href="user-chat.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Mensajes</span>
                </a>
                <a href="user-profile.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Perfil</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-link">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main" style="overflow-y: hidden; display: flex; flex-direction: column;">

            <!-- Header -->
            <header class="app-header" style="flex: 0 0 auto; padding: 24px 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div>
                        <h1 class="text-h2">Buscar Servicios</h1>
                        <p class="text-body">Encuentra al profesional ideal</p>
                    </div>
                    <div class="user-avatar"
                        style="width: 40px; height: 40px; background: #DBEAFE; color: #1E40AF; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; font-size: 0.9rem;">
                        U</div>
                </div>
            </header>

            <!-- Search Content Grid -->
            <div
                style="display: grid; grid-template-columns: 280px 1fr; gap: 24px; flex: 1; overflow: hidden; padding-bottom: 24px;">

                <!-- Filters Sidebar -->
                <div class="bento-card" style="padding: 24px; overflow-y: auto; height: 100%;">
                    <h3 class="text-h3" style="font-size: 1.1rem; margin-bottom: 20px;">Filtros</h3>

                    <!-- Search Input -->
                    <div style="margin-bottom: 24px;">
                        <label class="text-sm"
                            style="font-weight: 600; display: block; margin-bottom: 8px;">Buscar</label>
                        <input type="text" id="filter-search" placeholder="Palabra clave..."
                            style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
                    </div>

                    <!-- Location Input -->
                    <div style="margin-bottom: 24px;">
                        <label class="text-sm"
                            style="font-weight: 600; display: block; margin-bottom: 8px;">Ubicación</label>
                        <div style="position: relative;">
                            <span
                                style="position: absolute; left: 10px; top: 10px; color: var(--text-secondary);">📍</span>
                            <input type="text" id="filter-location" placeholder="Ciudad o Distrito"
                                style="width: 100%; padding: 10px 10px 10px 32px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
                        </div>
                    </div>

                    <!-- Price Range -->
                    <div style="margin-bottom: 24px;">
                        <label class="text-sm" style="font-weight: 600; display: block; margin-bottom: 8px;">Rango de
                            Precio ($)</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="number" id="filter-min-price" placeholder="Min"
                                style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
                            <span style="color: var(--text-secondary);">-</span>
                            <input type="number" id="filter-max-price" placeholder="Max"
                                style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
                        </div>
                    </div>

                    <!-- Rating -->
                    <div style="margin-bottom: 24px;">
                        <label class="text-sm"
                            style="font-weight: 600; display: block; margin-bottom: 8px;">Calificación Mínima</label>
                        <div style="display: flex; flex-direction: column; gap: 6px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="rating" value="" checked> <span class="text-sm">Todas</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="rating" value="4.5"> <span class="text-sm">★ 4.5+
                                    (Excelente)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="rating" value="4"> <span class="text-sm">★ 4.0+ (Muy
                                    bueno)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="rating" value="3"> <span class="text-sm">★ 3.0+ (Bueno)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Categories -->
                    <div style="margin-bottom: 24px;">
                        <label class="text-sm"
                            style="font-weight: 600; display: block; margin-bottom: 8px;">Categoría</label>
                        <select id="filter-category"
                            style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
                            <option value="">Todas las categorías</option>
                            <option value="Hogar">Hogar</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Diseño">Diseño</option>
                            <option value="Educación">Educación</option>
                            <option value="Bienestar">Bienestar</option>
                            <option value="Limpieza">Limpieza</option>
                            <option value="Plomería">Plomería</option>
                            <option value="Electricidad">Electricidad</option>
                            <option value="Carpintería">Carpintería</option>
                            <option value="Mascotas">Mascotas</option>
                            <option value="Belleza">Belleza</option>
                            <option value="Eventos">Eventos</option>
                        </select>
                    </div>

                    <button id="apply-filters-btn" class="btn"
                        style="width: 100%; justify-content: center; background: var(--primary); color: white;">Aplicar
                        Filtros</button>
                    <button id="reset-filters-btn" class="btn"
                        style="width: 100%; justify-content: center; background: transparent; color: var(--text-secondary); margin-top: 8px; border: 1px solid var(--border);">Limpiar</button>
                </div>

                <!-- Results Area -->
                <div style="overflow-y: auto; padding-right: 8px;">

                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 class="text-h3" id="results-count">Resultados</h2>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="text-sm" style="color: var(--text-secondary);">Ordenar por:</span>
                            <select id="sort-select"
                                style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem;">
                                <option value="newest">Más recientes</option>
                                <option value="price_asc">Precio: Menor a Mayor</option>
                                <option value="price_desc">Precio: Mayor a Menor</option>
                                <option value="rating_desc">Mejor calificados</option>
                            </select>
                        </div>
                    </div>

                    <div id="active-filters-badges"
                        style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;"></div>

                    <div id="services-results"
                        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
                        <!-- Results will be injected here -->
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const API_BASE_URL = "/api/v1";
            const token = sessionStorage.getItem("serviced_token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            // Elements
            const resultsContainer = document.getElementById("services-results");
            const filterSearch = document.getElementById("filter-search");
            const filterLocation = document.getElementById("filter-location");
            const filterMinPrice = document.getElementById("filter-min-price");
            const filterMaxPrice = document.getElementById("filter-max-price");
            const filterCategory = document.getElementById("filter-category");
            const sortSelect = document.getElementById("sort-select");
            const filterRatingRadios = document.querySelectorAll('input[name="rating"]');

            const applyBtn = document.getElementById("apply-filters-btn");
            const resetBtn = document.getElementById("reset-filters-btn");

            // Load logic
            async function loadServices() {
                resultsContainer.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Cargando servicios...</p>";

                // Build Query Params
                const params = new URLSearchParams();
                if (filterSearch.value.trim()) params.append("search", filterSearch.value.trim());
                if (filterLocation.value.trim()) params.append("location", filterLocation.value.trim());
                if (filterMinPrice.value) params.append("min_price", filterMinPrice.value);
                if (filterMaxPrice.value) params.append("max_price", filterMaxPrice.value);
                if (filterCategory.value) params.append("category", filterCategory.value);

                const selectedRating = document.querySelector('input[name="rating"]:checked');
                if (selectedRating && selectedRating.value) params.append("min_rating", selectedRating.value);

                // Sorting
                const sortValue = sortSelect.value;
                if (sortValue === "price_asc") {
                    params.append("sort_by", "price");
                    params.append("sort_desc", "false");
                } else if (sortValue === "price_desc") {
                    params.append("sort_by", "price");
                    params.append("sort_desc", "true");
                } else if (sortValue === "rating_desc") {
                    params.append("sort_by", "rating");
                    params.append("sort_desc", "true");
                } else {
                    params.append("sort_by", "created_at");
                    params.append("sort_desc", "true");
                }

                try {
                    const resp = await fetch(`${API_BASE_URL}/services/?${params.toString()}`, {
                        headers: { "Authorization": "Bearer " + token }
                    });

                    if (!resp.ok) throw new Error("API Error");

                    const services = await resp.json();

                    document.getElementById('results-count').textContent = `${services.length} Resultados`;

                    if (!Array.isArray(services) || services.length === 0) {
                        resultsContainer.innerHTML = `
                            <div class="bento-card" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                                <div style="font-size: 3rem; margin-bottom: 16px;">🔍</div>
                                <h3 class="text-h3">No se encontraron servicios</h3>
                                <p class="text-body">Intenta ajustar tus filtros de búsqueda.</p>
                            </div>`;
                        return;
                    }

                    resultsContainer.innerHTML = "";
                    services.forEach(s => {
                        const card = document.createElement("div");
                        card.className = "bento-card";
                        card.style.display = "flex";
                        card.style.flexDirection = "column";
                        card.innerHTML = `
                            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:12px;">
                                <span class="badge" style="background: #EFF6FF; color: var(--primary); font-weight: 600; font-size: 0.75rem;">${s.category || 'Servicio'}</span>
                                <div style="font-weight:700; font-size:1.1rem;">$${(s.price ?? 0).toLocaleString('es-CO')}</div>
                            </div>
                            
                            <h3 class="text-h3" style="font-size:1.1rem; margin-bottom: 8px; flex:1;">${s.title}</h3>
                            
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 0.9rem; color: var(--text-secondary);">
                                <span>📍 ${s.provider && s.provider.location ? s.provider.location : 'Ubicación n/a'}</span>
                            </div>
                            
                            <p class="text-body" style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; height: 4.2em;">
                                ${s.description}
                            </p>
                            
                            <div style="border-top: 1px solid var(--border); padding-top: 16px; display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span style="color: #FBBF24;">★</span>
                                    <span style="font-weight: 600;">${s.rating ? s.rating.toFixed(1) : 'Nuevo'}</span>
                                </div>
                                <a href="service-detail.html?id=${s.id}" class="btn" style="background: var(--text-main); color: white; padding: 8px 16px; font-size: 0.9rem; text-decoration: none;">Ver Detalles</a>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });

                } catch (err) {
                    console.error(err);
                    resultsContainer.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color: red;'>Error al cargar servicios.</p>";
                }
            }

            // Events
            applyBtn.addEventListener("click", loadServices);
            sortSelect.addEventListener("change", loadServices);

            resetBtn.addEventListener("click", () => {
                filterSearch.value = "";
                filterLocation.value = "";
                filterMinPrice.value = "";
                filterMaxPrice.value = "";
                filterCategory.value = "";
                document.querySelector('input[name="rating"][value=""]').checked = true; // Select 'All'
                sortSelect.value = "newest";
                loadServices();
            });

            // Live search for keyword (debounce)
            let timeout;
            filterSearch.addEventListener("input", () => {
                clearTimeout(timeout);
                timeout = setTimeout(loadServices, 600);
            });

            // Initial Load
            loadServices();
        });
    </script>

    <script>
        // Avatar Sync
        (function () {
            try {
                const user = JSON.parse(sessionStorage.getItem("serviced_user"));
                if (user) {
                    document.querySelectorAll(".user-avatar").forEach(el => {
                        if (user.avatar_url) {
                            el.innerHTML = `<img src="${user.avatar_url}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                        } else {
                            el.textContent = (user.full_name || "U").split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
                        }
                    });
                }
            } catch (e) { }
        })();
    </script>
</body>

</html>
