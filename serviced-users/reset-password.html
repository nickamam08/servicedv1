<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - SERVICED</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: var(--bg-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="bento-card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">

        <a href="index.html" style="display: flex; justify-content: center; margin-bottom: 24px;">
            <img src="log.png" alt="SERVICED" style="height: 56px; width: auto;">
        </a>

        <h1 class="text-h2" style="font-size: 1.5rem; margin-bottom: 8px;">Nueva contraseña</h1>
        <p class="text-body" style="font-size: 0.95rem; margin-bottom: 32px;">Ingresa tu nueva contraseña para acceder a
            tu cuenta.</p>

        <form id="reset-form">
            <div style="margin-bottom: 16px; text-align: left;">
                <label class="text-sm" style="display: block; margin-bottom: 8px; font-weight: 500;">Nueva
                    Contraseña</label>
                <input type="password" id="new-password" placeholder="Mínimo 8 caracteres" required minlength="8"
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit;">
            </div>

            <div style="margin-bottom: 24px; text-align: left;">
                <label class="text-sm" style="display: block; margin-bottom: 8px; font-weight: 500;">Confirmar
                    Contraseña</label>
                <input type="password" id="confirm-password" placeholder="••••••••" required minlength="8"
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit;">
            </div>

            <button type="submit" class="btn"
                style="width: 100%; background: var(--primary); color: white; justify-content: center; font-size: 1rem;">Restablecer
                contraseña</button>
        </form>

        <div id="success-box"
            style="display: none; margin-top: 24px; padding: 16px; background: #ECFDF5; color: #065F46; border-radius: 8px; font-size: 0.9rem;">
            Contraseña restablecida correctamente. Ahora puedes iniciar sesión.
            <div style="margin-top: 12px;">
                <a href="login.html" class="btn"
                    style="background: var(--primary); color: white; display: inline-flex;">Iniciar sesión</a>
            </div>
        </div>

        <p class="text-sm" style="margin-top: 24px;">
            <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Cacelar y
                volver</a>
        </p>
    </div>

    <script>
        (function () {
            const API_BASE_URL = "/api/v1";
            const form = document.getElementById("reset-form");
            const newPasswordInput = document.getElementById("new-password");
            const confirmPasswordInput = document.getElementById("confirm-password");
            const successBox = document.getElementById("success-box");

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const errorBox = document.createElement("div");
            errorBox.style.marginTop = "12px";
            errorBox.style.fontSize = "0.85rem";
            errorBox.style.color = "#DC2626";
            form.appendChild(errorBox);

            if (!token) {
                form.style.display = "none";
                errorBox.textContent = "Token de recuperación no válido o inexistente.";
                return;
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                errorBox.textContent = "";

                const password = newPasswordInput.value;
                const confirm = confirmPasswordInput.value;

                if (password !== confirm) {
                    errorBox.textContent = "Las contraseñas no coinciden.";
                    return;
                }

                if (password.length < 8) {
                    errorBox.textContent = "La contraseña debe tener al menos 8 caracteres.";
                    return;
                }

                if (!/[A-Z]/.test(password)) {
                    errorBox.textContent = "La contraseña debe tener al menos una mayúscula.";
                    return;
                }

                if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                    errorBox.textContent = "La contraseña debe tener al menos un carácter especial.";
                    return;
                }

                try {
                    const response = await fetch(API_BASE_URL + "/auth/reset-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ token, new_password: password }),
                    });

                    if (!response.ok) {
                        const data = await response.json().catch(() => ({}));
                        errorBox.textContent = data.detail || "Error al restablecer la contraseña.";
                        return;
                    }

                    form.style.display = "none";
                    successBox.style.display = "block";
                } catch (error) {
                    console.error(error);
                    errorBox.textContent = "Error de conexión con el servidor.";
                }
            });
        })();
    </script>

</body>

</html>
