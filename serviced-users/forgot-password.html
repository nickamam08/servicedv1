<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SERVICED</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: var(--bg-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="bento-card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">

        <a href="index.html" style="display: flex; justify-content: center; margin-bottom: 24px;">
            <img src="log.png" alt="SERVICED" style="height: 56px; width: auto;">
        </a>

        <h1 class="text-h2" style="font-size: 1.5rem; margin-bottom: 8px;">Recuperar acceso</h1>
        <p class="text-body" style="font-size: 0.95rem; margin-bottom: 32px;">Ingresa tu correo y te enviaremos un
            enlace para restablecer tu contraseña.</p>

        <form id="forgot-form">
            <div style="margin-bottom: 24px; text-align: left;">
                <label class="text-sm" style="display: block; margin-bottom: 8px; font-weight: 500;">Correo
                    Electrónico</label>
                <input type="email" id="reset-email" placeholder="nombre@ejemplo.com" required
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit;">
            </div>

            <button type="submit" class="btn"
                style="width: 100%; background: var(--primary); color: white; justify-content: center; font-size: 1rem;">Enviar
                enlace</button>
        </form>

        <div id="success-box"
            style="display: none; margin-top: 24px; padding: 16px; background: #ECFDF5; color: #065F46; border-radius: 8px; font-size: 0.9rem;">
            Se ha enviado un enlace de recuperación a tu correo electrónico. Revisa tu bandeja de entrada.
        </div>

        <p class="text-sm" style="margin-top: 24px;">
            <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Volver al
                inicio de sesión</a>
        </p>
    </div>

    <script>
        (function () {
            const API_BASE_URL = "/api/v1";
            const form = document.getElementById("forgot-form");
            const emailInput = document.getElementById("reset-email");
            const successBox = document.getElementById("success-box");

            const errorBox = document.createElement("div");
            errorBox.style.marginTop = "12px";
            errorBox.style.fontSize = "0.85rem";
            errorBox.style.color = "#DC2626";
            form.appendChild(errorBox);

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                errorBox.textContent = "";
                const email = emailInput.value.trim();

                try {
                    const response = await fetch(API_BASE_URL + "/auth/forgot-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email }),
                    });

                    if (!response.ok) {
                        const data = await response.json().catch(() => ({}));
                        errorBox.textContent = data.detail || "Error al procesar la solicitud.";
                        return;
                    }

                    form.style.display = "none";
                    successBox.style.display = "block";
                } catch (error) {
                    console.error(error);
                    errorBox.textContent = "Error de conexión con el servidor.";
                }
            });
        })();
    </script>

</body>

</html>
