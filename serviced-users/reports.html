<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte y Reportes - SERVICED</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 32px;
            margin-top: 24px;
        }

        @media (max-width: 1024px) {
            .report-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-body);
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .report-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .report-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .report-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pending {
            background: #FEF3C7;
            color: #92400E;
        }

        .status-resolved {
            background: #D1FAE5;
            color: #065F46;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-tertiary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo">
                    <img src="log.png" alt="SERVICED" style="height: 40px; width: auto;">
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="client-dashboard.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="search-services.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <span>Buscar Servicios</span>
                </a>
                <a href="user-requests.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span>Mis Solicitudes</span>
                </a>
                <a href="notifications.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Notificaciones</span>
                    <span id="notif-badge" class="unread-badge"></span>
                </a>
                <a href="user-chat.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Mensajes</span>
                    <span id="msg-badge" class="unread-badge"></span>
                </a>
                <a href="reports.html" class="nav-item active">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span>Reportes</span>
                </a>
                <a href="user-profile.html" class="nav-item">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Perfil</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="logout-link">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main">
            <header class="app-header">
                <div>
                    <h1 class="text-h2">Centro de Reportes</h1>
                    <p class="text-body">Informa sobre problemas o comportamiento inapropiado</p>
                </div>
                <div class="user-avatar" id="header-avatar">U</div>
            </header>

            <div class="report-grid">
                <!-- Report Form -->
                <div class="bento-card">
                    <h3 class="text-h3" style="margin-bottom: 24px;">Enviar nuevo reporte</h3>
                    <form id="report-form">
                        <div class="form-group">
                            <label>Asunto del reporte</label>
                            <input type="text" id="report-title" placeholder="¿Qué sucedió?" required>
                        </div>
                        <div class="form-group">
                            <label>Tipo de problema</label>
                            <select id="report-type" required>
                                <option value="" disabled selected>Selecciona una opción</option>
                                <option value="behavior">Conducta inapropiada</option>
                                <option value="payment">Problema de pago</option>
                                <option value="content">Contenido ofensivo</option>
                                <option value="technical">Error técnico</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Descripción detallada</label>
                            <textarea id="report-desc"
                                placeholder="Describe los detalles del incidente para ayudarnos a resolverlo..."
                                style="min-height: 150px; resize: none;" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" id="submit-btn"
                            style="width: 100%; height: 48px;">
                            <i class="fas fa-paper-plane mr-2"></i> Enviar Reporte
                        </button>
                    </form>
                </div>

                <!-- My Reports List -->
                <div class="bento-card">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <h3 class="text-h3">Mis Reportes Recientes</h3>
                        <span class="text-sm" id="report-count">Total: 0</span>
                    </div>
                    <div id="my-reports-list" class="report-list">
                        <div class="empty-state">
                            <i class="fas fa-folder-open fa-3x mb-3" style="opacity: 0.2;"></i>
                            <p>Cargando tus reportes...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api/v1';
        const token = sessionStorage.getItem('serviced_token');
        const userStr = sessionStorage.getItem('serviced_user');

        if (!token) window.location.href = 'login.html';

        // Avatar Sync
        (function () {
            try {
                if (userStr) {
                    const user = JSON.parse(userStr);
                    const avatar = document.getElementById('header-avatar');
                    if (user.avatar_url) {
                        avatar.innerHTML = `<img src="${user.avatar_url}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                    } else {
                        avatar.textContent = (user.full_name || "U").split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
                    }
                }
            } catch (e) { }
        })();

        async function apiFetch(endpoint, options = {}) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            if (res.status === 401) window.location.href = 'login.html';
            return res.ok ? res.json() : Promise.reject(await res.json());
        }

        async function loadMyReports() {
            try {
                const reports = await apiFetch('/reports/my-reports');
                const list = document.getElementById('my-reports-list');
                const countSpan = document.getElementById('report-count');
                list.innerHTML = '';
                countSpan.textContent = `Total: ${reports.length}`;

                if (reports.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-clipboard-check fa-3x mb-3" style="opacity: 0.2;"></i>
                            <p>No has enviado ningún reporte aún.</p>
                        </div>
                    `;
                    return;
                }

                reports.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'report-card';
                    div.innerHTML = `
                        <div style="flex: 1;">
                            <h4 style="font-weight: 600; margin-bottom: 4px; color: var(--text-main);">${r.title}</h4>
                            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-secondary);">
                                <i class="far fa-calendar-alt"></i>
                                <span>${new Date(r.created_at).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' })}</span>
                                <span style="opacity: 0.3;">•</span>
                                <span style="text-transform: capitalize;">${r.type}</span>
                            </div>
                        </div>
                        <span class="status-badge ${r.status === 'RESOLVED' ? 'status-resolved' : 'status-pending'}">
                            ${r.status === 'RESOLVED' ? '<i class="fas fa-check-circle mr-1"></i> RESUELTO' : '<i class="fas fa-clock mr-1"></i> PENDIENTE'}
                        </span>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('my-reports-list').innerHTML = '<p style="color:red; text-align:center;">Error al cargar reportes.</p>';
            }
        }

        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Enviando...';

            try {
                await apiFetch('/reports', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: document.getElementById('report-title').value,
                        type: document.getElementById('report-type').value,
                        description: document.getElementById('report-desc').value
                    })
                });

                // Success animation/feedback could be better than alert
                const list = document.getElementById('my-reports-list');
                const successMsg = document.createElement('div');
                successMsg.style = "background: var(--success); color: white; padding: 12px; border-radius: 8px; margin-bottom: 16px; text-align: center; animation: fadeIn 0.3s;";
                successMsg.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Reporte enviado correctamente';
                list.prepend(successMsg);

                setTimeout(() => successMsg.remove(), 3000);

                e.target.reset();
                loadMyReports();
            } catch (err) {
                alert('Error al enviar el reporte: ' + (err.detail || 'Desconocido'));
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Logout listener
        document.querySelector('.logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        loadMyReports();
    </script>
    <script src="sidebar-badges.js"></script>
</body>

</html>
