<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Servicios - Admin SERVICED</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="admin-dashboard.html" class="sidebar-logo">SERVICED <span
                        style="font-weight: 400; opacity: 0.7;">Admin</span></a>
            </div>

            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="admin-users.html" class="nav-item">
                    <span class="nav-icon">👥</span>
                    <span>Usuarios</span>
                </a>
                <a href="admin-services.html" class="nav-item active">
                    <span class="nav-icon">🛠️</span>
                    <span>Servicios</span>
                </a>
                <a href="admin-requests.html" class="nav-item">
                    <span class="nav-icon">📩</span>
                    <span>Solicitudes</span>
                </a>
                <a href="admin-categories.html" class="nav-item">
                    <span class="nav-icon">🏷️</span>
                    <span>Categorías</span>
                </a>
                <a href="admin-reports.html" class="nav-item">
                    <span class="nav-icon">⚠️</span>
                    <span>Reportes</span>
                </a>
                <a href="admin-settings.html" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span>Configuración</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="/users/login.html" class="logout-link">
                    <span class="nav-icon">🚪</span>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main">

            <!-- Header -->
            <header class="app-header">
                <div>
                    <h1 class="text-h2">Moderación de Servicios</h1>
                    <p class="text-body" style="font-size: 0.9rem;">Revisa y gestiona los servicios publicados.</p>
                </div>

                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="user-avatar" style="background: #111827; color: white;">AD</div>
                    <div>
                        <div style="font-weight: 600; font-size: 0.9rem;">Administrador</div>
                    </div>
                </div>
            </header>

            <div class="bento-grid">

                <!-- Stats -->
                <div class="bento-card" style="grid-column: span 3;">
                    <div class="text-body" style="font-size: 0.9rem;">Total Servicios</div>
                    <div id="total-services-count" class="text-h2">...</div>
                </div>
                <div class="bento-card" style="grid-column: span 3;">
                    <div class="text-body" style="font-size: 0.9rem;">Activos</div>
                    <div id="active-services-count" class="text-h2" style="color: var(--success);">...</div>
                </div>
                <div class="bento-card" style="grid-column: span 3;">
                    <div class="text-body" style="font-size: 0.9rem;">Inactivos</div>
                    <div id="inactive-services-count" class="text-h2" style="color: var(--danger);">...</div>
                </div>
                <div class="bento-card" style="grid-column: span 3;">
                    <button class="btn btn-primary" style="width: 100%; height: 100%;" onclick="loadServices()">
                        🔄 Actualizar
                    </button>
                </div>

                <!-- Filters -->
                <div class="bento-card"
                    style="grid-column: span 12; padding: 20px; display: flex; flex-direction: row; gap: 16px; align-items: center;">
                    <div style="flex: 1;">
                        <input type="text" id="search-input" placeholder="Buscar servicio o proveedor..."
                            style="width: 100%;">
                    </div>
                    <select id="status-filter"
                        style="padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit;">
                        <option value="all">Todos los Estados</option>
                        <option value="active">Activos</option>
                        <option value="inactive">Inactivos</option>
                    </select>
                    <select id="sort-filter"
                        style="padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit;">
                        <option value="newest">Más Recientes</option>
                        <option value="price_asc">Precio: Menor a Mayor</option>
                        <option value="price_desc">Precio: Mayor a Menor</option>
                        <option value="rating_desc">Mejor Valorados</option>
                    </select>
                </div>

                <!-- Services Grid -->
                <div id="services-container" class="bento-grid"
                    style="grid-column: span 12; display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; padding: 0;">
                    <!-- Services will be populated here -->
                </div>

            </div>

        </main>
    </div>

    <!-- Service Detail Modal -->
    <div id="service-modal" class="modal"
        style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <div
            style="background: white; width: 90%; max-width: 800px; margin: 5vh auto; border-radius: 16px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);">
            <button onclick="closeModal()"
                style="position: absolute; right: 20px; top: 20px; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">×</button>
            <div id="modal-content" style="padding: 40px;">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <script src="admin-shared.js"></script>
    <script src="admin-services.js"></script>
</body>

</html>
